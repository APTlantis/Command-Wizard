[manifest]
schema = "APTlantis Entity Manifest"
schema_version = "2.4"
manifest_type = "project"
canonical_name = "CommandWizard.manifest.toml"
last_updated = "2026-07-30"
maintainer = "Herb"

[entity]
id = "commandwizard"
title = "CommandWizard"
kind = "project"
class = "project"
status = "active"
description = "Local-first Tauri desktop application for constructing and managing command workflows from TOML schemas."
tags = [
    "tauri",
    "react",
    "typescript",
    "rust",
    "tailwind",
    "blue-slate",
    "desktop",
    "schema-driven",
    "toml",
    "local-first",
    "command-generation",
    "cli-import",
]

[tag_colors]
tauri = "#21C6B8"
react = "#00D8FF"
typescript = "#3178C6"
rust = "#D9A441"
tailwind = "#38BDF8"
blue-slate = "#65F2FF"
desktop = "#3FB950"
schema-driven = "#29B6F6"
toml = "#ADB5BD"
local-first = "#3FB950"
command-generation = "#0D89C8"
cli-import = "#30D58C"

[project]
type = "desktop-application"
portfolio_class = "project"
stage = "active-rebuild"
version = "2.0.0"

[governance]
primary_standard = "DRS"
primary_standard_path = "D:\\.library\\aptlantis_core\\DRS\\README.md"
additional_standards = [
    "WGS",
    "PPS",
]
additional_standard_paths = [
    "D:\\.library\\aptlantis_core\\WGS\\README.md",
    "D:\\.library\\aptlantis_core\\PPS\\README.md",
]
inherits_from = "..\\DRS.manifest.toml"

[lifecycle]
state = "active"
last_reviewed = "2026-07-30"
maintainer = "Herb"

[paths]
root = "D:\\DRS\\CommandWizard"

[documentation]
project_readme = "Project-README.md"
readme = "README.md"
proposal = "Project-Proposal.md"

[relationships]
parent = "D:\\DRS"
child_projects = []

[state]
stability = "pre-release"
active_development = true
known_gaps = [
    "Tauri package is not yet DRS release-verified.",
    "macOS and Linux data-path behavior still needs platform verification.",
]

[visual_system]
name = "Blue Slate"
path = "D:\\.library\\aptlantis_core\\blue.slate\\README.md"
adoption_level = "active"
framework_profile = "Tauri / Vite / React"
token_source = "D:\\.library\\aptlantis_core\\blue.slate\\spec\\tokens\\BlueSlate.Tokens.json"

[implementation]
name = "CommandWizard Tauri rebuild"
status = "active"
started = "2026-07-30"
stack = [
    "Tauri v2",
    "React",
    "TypeScript",
    "Tailwind v4",
    "Rust",
    "Zustand",
    "Vitest",
    "Playwright",
]
proposal = "Project-Proposal.md"
safety_boundary = "Generated commands are copy/export only; help, completion, and CLI script help capture are explicit import probes. CLI import creates managed shims but does not automatically edit PATH."
previous_implementation_cleanup = "Previous implementation files, old test projects, old packaging assets, project images, and old release evidence removed from this working project after backup confirmation from Herb on 2026-07-30."

[agent]
read_first = [
    "AGENTS.md",
    "CommandWizard.manifest.toml",
    "Project-README.md",
    "Project-Proposal.md",
]
authoritative_docs = [
    "CommandWizard.manifest.toml",
    "Project-README.md",
    "Project-Proposal.md",
    "AGENTS.md",
]
safe_to_modify = true
notes = "Keep implementation, manifest, and documentation aligned with verified Tauri behavior."

[structure]
required_files = [
    "package.json",
    "src-tauri/Cargo.toml",
    "src/App.tsx",
]
required_child_project_files = [
    "AGENTS.md",
    "[EntityName].manifest.toml",
    "Project-README.md",
]

[verification]
level = "development-verified"
evidence = "Current local checks: npm run build, npm run test, npm run test:rust, npm run test:ui."
reviewed = "2026-07-30"
build_verified = true
tests_verified = true
artifact_verified = false
release_verified = false

[release]
version = "2.0.0"
date = "2026-07-30"
status = "pre-release"
release_verified = false
