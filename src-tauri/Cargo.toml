[package]
name = "commandwizard"
version = "2.0.0"
description = "Local-first command workflow builder"
authors = ["Aptlantis"]
edition = "2021"

[lib]
name = "commandwizard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
dirs = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-dialog = "2.4.1"
thiserror = "2.0.17"
toml = "0.9.8"
